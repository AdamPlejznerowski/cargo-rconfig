[package]
name = "cargo-rconfig"
version = "0.1.0"
edition = "2024"
authors = ["Adam Plejznerowski <adam.plejznerowski@gmail.com>"]
description = "Cargo subcommand extending Rust's build system with declarative environment and flag management. (WIP)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/AdamPlejznerowski/cargo-rconfig"

[lib]
name = "rconfig"
path = "src/lib.rs"

[[bin]]
name = "cargo-rconfig"
path = "src/main.rs"

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"

missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_docs_in_private_items = "allow"
similar_names = "allow"
tabs_in_doc_comments = "allow"
format_push_string = "allow"


